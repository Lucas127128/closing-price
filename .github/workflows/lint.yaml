name: lint
on: [push]
jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Cache
        uses: actions/cache@v6
        with:
          key: ${{ runner.os  }}-key
          path: |
            .svelte-kit/**/*
            node_modules/**/*
      - name: Install bun
        uses: oven-sh/setup-bun@v2
      - name: Install dependency
        run: bun i --frozen-lockfile
      - name: Sync types
        run: bun sync
      - name: Lint
        run: bun lint

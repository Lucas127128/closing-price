name: lint
on: [push]
jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install bun
        uses: oven-sh/setup-bun@v2
      - name: Install dependency
        run: bun i --frozen-lockfile
      - name: Check format
        run: bun fmt --check
